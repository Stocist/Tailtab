name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Export the tag once without its v prefix to keep release versions synchronized and manifests numeric.
      - name: Version from the tag
        run: echo "TAILTAB_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Tests
        run: ./scripts/test.sh

      - name: Build extensions and the native host
        run: ./scripts/build.sh

      - name: Cross-compile the host
        run: |
          set -euo pipefail
          ldflags="$(./scripts/ldflags.sh)"
          mkdir -p release
          build() {
            CGO_ENABLED=0 GOOS="$1" GOARCH="$2" \
              go build -trimpath -ldflags "$ldflags" -o "release/tailtab-$1-$2${3:-}" ./cmd/tailtab
          }
          build darwin arm64
          build darwin amd64
          build linux amd64
          build linux arm64
          build windows amd64 .exe
          build windows arm64 .exe

      - name: Zip the extensions
        run: |
          set -euo pipefail
          (cd extension/dist/chromium && zip -qr "../../../release/tailtab-chromium-${TAILTAB_VERSION}.zip" .)
          (cd extension/dist/firefox && zip -qr "../../../release/tailtab-firefox-${TAILTAB_VERSION}.zip" .)

      - name: Sign the Firefox extension through AMO (unlisted)
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$AMO_JWT_ISSUER" ] || [ -z "$AMO_JWT_SECRET" ]; then
            echo "AMO secrets not set; skipping signing (the unsigned zip is still attached)."
            exit 0
          fi
          npx --yes web-ext@8 sign \
            --source-dir extension/dist/firefox \
            --artifacts-dir release/xpi \
            --channel unlisted \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET"
          mv release/xpi/*.xpi "release/tailtab-${TAILTAB_VERSION}.xpi"
          rmdir release/xpi

      # Firefox polls the manifest's update_url, which is the latest release's
      # updates.json. Only a signed xpi can be offered, so this follows signing.
      - name: Firefox update manifest
        run: |
          set -euo pipefail
          xpi="release/tailtab-${TAILTAB_VERSION}.xpi"
          [ -f "$xpi" ] || { echo "no signed xpi; skipping updates.json"; exit 0; }
          hash="$(sha256sum "$xpi" | cut -d' ' -f1)"
          cat > release/updates.json <<JSON
          {
            "addons": {
              "tailtab@stocist.dev": {
                "updates": [
                  {
                    "version": "${TAILTAB_VERSION}",
                    "update_link": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/tailtab-${TAILTAB_VERSION}.xpi",
                    "update_hash": "sha256:${hash}"
                  }
                ]
              }
            }
          }
          JSON
          cat release/updates.json

      - name: Checksums
        run: (cd release && sha256sum * > SHA256SUMS)

      - name: Release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            cat .github/release-notes.md | sed "s/<version>/${TAILTAB_VERSION}/g"
            echo
            echo "## Changes"
            echo
            gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="${GITHUB_REF_NAME}" --jq .body | sed '1{/^## What/d}'
          } > release-notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release/* \
            --title "Tailtab ${TAILTAB_VERSION}" \
            --notes-file release-notes.md \
            --verify-tag
