name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Host and extension tests
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: gofmt
        run: |
          out="$(gofmt -l cmd internal)"
          if [ -n "$out" ]; then echo "gofmt needed on:"; echo "$out"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: go test (race)
        run: go test -race ./...

      - name: extension tests
        run: node extension/test/background.test.js

      - name: build
        run: OUT="bin/tailtab${{ runner.os == 'Windows' && '.exe' || '' }}" ./scripts/build.sh

      # Drives the built host over native messaging like a browser would:
      # tsnet must start, the loopback proxy must listen, and the coordination
      # server must answer. This is the end-to-end check for each OS.
      - name: host smoke test
        run: node scripts/smoke.js "bin/tailtab${{ runner.os == 'Windows' && '.exe' || '' }}"
