<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>tailtab</title>
    <style>
      :root {
        color-scheme: light dark;
        --fg: #1b1b1f;
        --muted: #5c5c66;
        --bg: #ffffff;
        --line: #dcdce3;
        --accent: #2b5cff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #ececf1;
          --muted: #a0a0ad;
          --bg: #1c1c20;
          --line: #34343c;
          --accent: #7d9bff;
        }
      }
      /* Any author-origin display rule below would otherwise beat the user
         agent's [hidden] { display: none }, which is what left the empty
         details grid on screen before login: dl is display: grid. One rule
         here covers every element the popup hides. */
      [hidden] {
        display: none !important;
      }
      body {
        width: 280px;
        margin: 0;
        padding: 14px;
        font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--fg);
        background: var(--bg);
      }
      h1 {
        margin: 0 0 10px;
        font-size: 14px;
        letter-spacing: 0.01em;
      }
      #state {
        font-weight: 600;
      }
      #hint {
        color: var(--muted);
      }
      dl {
        margin: 10px 0 0;
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 3px 10px;
        border-top: 1px solid var(--line);
        padding-top: 10px;
      }
      dt {
        color: var(--muted);
      }
      dd {
        margin: 0;
        overflow-wrap: anywhere;
      }
      .actions {
        margin-top: 12px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      button {
        font: inherit;
        padding: 5px 10px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: transparent;
        color: var(--fg);
        cursor: pointer;
      }
      button.primary {
        border-color: var(--accent);
        color: var(--accent);
        font-weight: 600;
      }
      .warn {
        margin-top: 10px;
        padding: 7px 9px;
        border-radius: 6px;
        border: 1px solid var(--line);
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <h1>tailtab</h1>
    <div id="state">Starting…</div>
    <div id="hint"></div>

    <dl id="details" hidden>
      <dt>Tailnet</dt>
      <dd id="tailnet"></dd>
      <dt>Machine</dt>
      <dd id="hostname"></dd>
      <dt>Address</dt>
      <dd id="selfip"></dd>
      <dt>Proxy</dt>
      <dd id="port"></dd>
    </dl>

    <div class="actions">
      <button id="login" class="primary" hidden>Log in</button>
      <button id="connect" hidden>Connect</button>
      <button id="disconnect" hidden>Disconnect</button>
      <button id="logout" hidden>Log out</button>
    </div>

    <div class="warn" id="warning" hidden></div>

    <script src="rules.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
